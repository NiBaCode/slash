<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --void: #090A0C; --panel: #15161A; --bone: #EEE9DF; --silver: #A3A3A3; --yellow: #FFB000; --line: #2B2C32; }
  * { box-sizing: border-box; }
  html { background: var(--void); color-scheme: dark; }
  body { margin: 0; color: var(--bone); background: var(--void); font: 400 17px/1.5 "Space Grotesk", system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px; }
  h1 { margin: 0; font-size: clamp(56px, 16vw, 96px); line-height: .95; letter-spacing: -0.04em; }
  h1 span { color: var(--yellow); }
  p { color: var(--silver); font-size: 19px; }
  ul { list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 12px; }
  a.set { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; padding: 20px; border-radius: 18px; background: var(--panel); color: var(--bone); text-decoration: none; border: 1px solid transparent; }
  a.set:hover, a.set:focus-visible { border-color: var(--yellow); outline: none; }
  a.set span { color: var(--silver); font-size: 16px; }
  footer { color: var(--silver); font-size: 16px; margin-top: 48px; border-top: 1px solid var(--line); padding-top: 24px; } footer a { color: var(--yellow); }
</style>
</head>

</main>
</body>
</html>
